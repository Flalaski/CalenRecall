<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: #ffd700;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      color: #a0a0c0;
      margin-bottom: 24px;
    }
    .features {
      text-align: left;
      display: inline-block;
      font-size: 13px;
      line-height: 1.8;
    }
    .features span {
      color: #ffd700;
    }
    .version {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>CalenRecall</h1>
  <div class="subtitle">A Calendar Journal for a Lifetime of Memories</div>
  <div class="features">
    <span>✦</span> Navigate time across 17 calendar systems<br>
    <span>✦</span> Rich journal entries with markdown &amp; tags<br>
    <span>✦</span> Powerful search &amp; recall across decades<br>
    <span>✦</span> 37 built-in themes<br>
    <span>✦</span> Fully offline &amp; private
  </div>
  <div class="version">CalenRecall — Installer</div>
</body>
</html>
